[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# QDay Aevum testnet (chain ID 44005)
[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

# Blockscout verification (per QDay docs):
#   forge verify-contract --chain-id 44005 --verifier blockscout \
#     --verifier-url https://explorer-test.qday.info/api <ADDR> src/AgentPayVault.sol:AgentPayVault
[etherscan]
aevum = { key = "", url = "https://explorer-test.qday.info/api" }
